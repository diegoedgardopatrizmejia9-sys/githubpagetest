<!DOCTYPE html>
<html lang="es">
<head>
    <link rel="icon" type="image/png" href="Logo de MS/Captura de pantalla 2026-10-08 173318.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Juego de Memoria - MODULO ESTUDIOS</title>

    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Press Start 2P', 'Courier New', monospace;
            -webkit-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        html, body {
            overscroll-behavior: none;
            -webkit-overflow-scrolling: touch;
        }

        body {
            background-color: #1a1a2e;
            background-image:
                linear-gradient(45deg, #16213e 25%, transparent 25%),
                linear-gradient(-45deg, #16213e 25%, transparent 25%),
                linear-gradient(45deg, transparent 75%, #16213e 75%),
                linear-gradient(-45deg, transparent 75%, #16213e 75%);
            background-size: 20px 20px;
            background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
            color: #fff;
        }

        /* ============================================
           PANTALLA DE SELECCIÓN DE NIVELES
           ============================================ */
        #pantalla-niveles {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 1000px;
            animation: aparecer-pixel 0.5s steps(5) forwards;
        }

        @keyframes aparecer-pixel {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .barra-superior-niveles {
            width: 100%;
            display: flex;
            justify-content: flex-start;
            margin-bottom: 15px;
        }

        .titulo-niveles {
            font-size: clamp(1rem, 3vw, 1.8rem);
            color: #ffcc00;
            text-shadow:
                3px 3px 0 #ff6600,
                6px 6px 0 #000;
            margin-bottom: 20px;
            text-align: center;
            animation: flotar-pixel 2s steps(4) infinite;
            line-height: 1.8;
        }

        @keyframes flotar-pixel {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        .subtitulo-niveles {
            font-size: clamp(0.55rem, 1.3vw, 0.75rem);
            color: #fff;
            background-color: #333;
            padding: 12px 20px;
            border: 4px solid #fff;
            margin-bottom: 30px;
            text-align: center;
            line-height: 1.8;
            box-shadow:
                4px 4px 0 #000,
                inset -4px -4px 0 rgba(0,0,0,0.3),
                inset 4px 4px 0 rgba(255,255,255,0.2);
        }

        .grid-niveles {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 12px;
            width: 100%;
            padding: 20px;
            background-color: #0f0f23;
            background-image:
                repeating-linear-gradient(0deg, transparent, transparent 2px, #1a1a3e 2px, #1a1a3e 4px);
            border: 6px solid #fff;
            box-shadow:
                8px 8px 0 #000,
                inset -4px -4px 0 rgba(0,0,0,0.5);
        }

        .boton-nivel {
            aspect-ratio: 1 / 1;
            border: 5px solid #fff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.1s steps(2), box-shadow 0.1s steps(2);
            position: relative;
            overflow: hidden;
            color: #ffffff;
            text-shadow: 2px 2px 0 #000;
            min-width: 48px;
            min-height: 48px;
            box-shadow:
                6px 6px 0 #000,
                inset -4px -4px 0 rgba(0,0,0,0.3),
                inset 4px 4px 0 rgba(255,255,255,0.3);
        }

        .boton-nivel .numero-nivel {
            font-size: clamp(1rem, 2vw, 1.6rem);
            line-height: 1;
        }

        .boton-nivel .estrellas {
            font-size: clamp(0.5rem, 1vw, 0.7rem);
            margin-top: 6px;
        }

        .boton-nivel.desbloqueado {
            background-color: #00b894;
            background-image:
                repeating-linear-gradient(45deg,
                    #00b894,
                    #00b894 8px,
                    #55efc4 8px,
                    #55efc4 16px);
        }

        @media (hover: hover) {
            .boton-nivel.desbloqueado:hover {
                transform: translate(-3px, -3px);
                box-shadow:
                    9px 9px 0 #000,
                    inset -4px -4px 0 rgba(0,0,0,0.3),
                    inset 4px 4px 0 rgba(255,255,255,0.3);
            }
        }

        .boton-nivel.desbloqueado:active {
            transform: translate(3px, 3px);
            box-shadow:
                3px 3px 0 #000,
                inset -4px -4px 0 rgba(0,0,0,0.3),
                inset 4px 4px 0 rgba(255,255,255,0.3);
        }

        .boton-nivel.completado {
            background-color: #fdcb6e;
            background-image:
                repeating-linear-gradient(-45deg,
                    #fdcb6e,
                    #fdcb6e 8px,
                    #ffeaa7 8px,
                    #ffeaa7 16px);
            color: #d35400;
            text-shadow: 2px 2px 0 #fff;
        }

        @media (hover: hover) {
            .boton-nivel.completado:hover {
                transform: translate(-3px, -3px);
                box-shadow:
                    9px 9px 0 #000,
                    inset -4px -4px 0 rgba(0,0,0,0.3),
                    inset 4px 4px 0 rgba(255,255,255,0.3);
            }
        }

        .boton-nivel.completado:active {
            transform: translate(3px, 3px);
            box-shadow:
                3px 3px 0 #000,
                inset -4px -4px 0 rgba(0,0,0,0.3),
                inset 4px 4px 0 rgba(255,255,255,0.3);
        }

        .boton-nivel.bloqueado {
            background-color: #636e72;
            background-image:
                repeating-linear-gradient(90deg,
                    #636e72,
                    #636e72 6px,
                    #b2bec3 6px,
                    #b2bec3 12px);
            cursor: not-allowed;
            color: #2d3436;
            opacity: 0.8;
        }

        .boton-nivel.bloqueado::after {
            content: "🔒";
            position: absolute;
            font-size: clamp(1.2rem, 2.5vw, 1.8rem);
            opacity: 0.95;
            filter: drop-shadow(2px 2px 0 #000);
        }

        .boton-nivel.bloqueado .numero-nivel,
        .boton-nivel.bloqueado .estrellas {
            visibility: hidden;
        }

        /* ============================================
           PANTALLA DE JUEGO
           ============================================ */
        #pantalla-juego {
            display: none;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 1000px;
        }

        #pantalla-juego.visible {
            display: flex;
            animation: aparecer-pixel 0.5s steps(5) forwards;
        }

        .barra-superior {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            margin-bottom: 20px;
            gap: 12px;
            flex-wrap: wrap;
        }

        .boton-volver {
            background-color: #ff7675;
            background-image:
                repeating-linear-gradient(45deg,
                    #ff7675,
                    #ff7675 6px,
                    #d63031 6px,
                    #d63031 12px);
            border: 4px solid #ffffff;
            padding: 12px 20px;
            font-size: clamp(0.55rem, 1.2vw, 0.75rem);
            font-weight: bold;
            color: #ffffff;
            cursor: pointer;
            box-shadow:
                5px 5px 0 #8b1e1e,
                inset -3px -3px 0 rgba(0,0,0,0.3),
                inset 3px 3px 0 rgba(255,255,255,0.3);
            transition: all 0.1s steps(2);
            font-family: inherit;
            min-height: 48px;
            min-width: 100px;
            text-shadow: 2px 2px 0 #000;
        }

        @media (hover: hover) {
            .boton-volver:hover {
                transform: translate(-2px, -2px);
                box-shadow:
                    7px 7px 0 #8b1e1e,
                    inset -3px -3px 0 rgba(0,0,0,0.3),
                    inset 3px 3px 0 rgba(255,255,255,0.3);
            }
        }

        .boton-volver:active {
            transform: translate(3px, 3px);
            box-shadow:
                2px 2px 0 #8b1e1e,
                inset -3px -3px 0 rgba(0,0,0,0.3),
                inset 3px 3px 0 rgba(255,255,255,0.3);
        }

        .boton-salir {
            background-color: #6c5ce7;
            background-image:
                repeating-linear-gradient(-45deg,
                    #6c5ce7,
                    #6c5ce7 6px,
                    #a29bfe 6px,
                    #a29bfe 12px);
            border: 4px solid #ffffff;
            padding: 12px 20px;
            font-size: clamp(0.55rem, 1.2vw, 0.75rem);
            font-weight: bold;
            color: #ffffff;
            cursor: pointer;
            box-shadow:
                5px 5px 0 #4834d4,
                inset -3px -3px 0 rgba(0,0,0,0.3),
                inset 3px 3px 0 rgba(255,255,255,0.3);
            transition: all 0.1s steps(2);
            font-family: inherit;
            min-height: 48px;
            min-width: 100px;
            text-shadow: 2px 2px 0 #000;
        }

        @media (hover: hover) {
            .boton-salir:hover {
                transform: translate(-2px, -2px);
                box-shadow:
                    7px 7px 0 #4834d4,
                    inset -3px -3px 0 rgba(0,0,0,0.3),
                    inset 3px 3px 0 rgba(255,255,255,0.3);
            }
        }

        .boton-salir:active {
            transform: translate(3px, 3px);
            box-shadow:
                2px 2px 0 #4834d4,
                inset -3px -3px 0 rgba(0,0,0,0.3),
                inset 3px 3px 0 rgba(255,255,255,0.3);
        }

        .info-nivel {
            background-color: #fdcb6e;
            background-image:
                repeating-linear-gradient(90deg,
                    #fdcb6e,
                    #fdcb6e 6px,
                    #ffeaa7 6px,
                    #ffeaa7 12px);
            border: 4px solid #ffffff;
            padding: 12px 20px;
            font-size: clamp(0.55rem, 1.2vw, 0.75rem);
            font-weight: bold;
            color: #2d3436;
            box-shadow:
                5px 5px 0 #d4a017,
                inset -3px -3px 0 rgba(0,0,0,0.2),
                inset 3px 3px 0 rgba(255,255,255,0.4);
            text-shadow: 1px 1px 0 #fff;
        }

        .titulo-juego {
            font-size: clamp(0.85rem, 2.5vw, 1.5rem);
            color: #ffcc00;
            text-shadow:
                3px 3px 0 #ff6600,
                6px 6px 0 #000;
            margin-bottom: 20px;
            text-align: center;
            line-height: 1.8;
        }

        .marcador {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .caja-marcador {
            background-color: #fdcb6e;
            background-image:
                repeating-linear-gradient(45deg,
                    #fdcb6e,
                    #fdcb6e 6px,
                    #ffeaa7 6px,
                    #ffeaa7 12px);
            border: 4px solid #ffffff;
            padding: 10px 18px;
            font-size: clamp(0.55rem, 1.2vw, 0.75rem);
            font-weight: bold;
            color: #2d3436;
            box-shadow:
                5px 5px 0 #d4a017,
                inset -3px -3px 0 rgba(0,0,0,0.2),
                inset 3px 3px 0 rgba(255,255,255,0.4);
            display: flex;
            align-items: center;
            gap: 8px;
            text-shadow: 1px 1px 0 #fff;
        }

        .caja-marcador span {
            color: #d63031;
            font-size: clamp(0.65rem, 1.4vw, 0.95rem);
        }

        /* ============================================
           TABLERO DE CARTAS
           ============================================ */
        .tablero {
            display: grid;
            gap: 12px;
            width: 100%;
            max-width: 800px;
            padding: 20px;
            background-color: #0f0f23;
            background-image:
                repeating-linear-gradient(0deg, transparent, transparent 2px, #1a1a3e 2px, #1a1a3e 4px);
            border: 6px solid #fff;
            box-shadow:
                8px 8px 0 #000,
                inset -4px -4px 0 rgba(0,0,0,0.5);
            margin: 0 auto;
        }

        .carta {
            aspect-ratio: 1 / 1;
            perspective: 1000px;
            cursor: pointer;
            transition: transform 0.1s steps(2);
            min-width: 48px;
            min-height: 48px;
        }

        @media (hover: hover) {
            .carta:hover:not(.volteada):not(.emparejada) {
                transform: scale(1.06);
            }
        }

        .carta:active:not(.volteada):not(.emparejada):not(.bloqueada-tactil) {
            transform: scale(0.95);
        }

        .carta-interna {
            position: relative;
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
            transition: transform 0.5s steps(10);
        }

        .carta.volteada .carta-interna,
        .carta.emparejada .carta-interna {
            transform: rotateY(180deg);
        }

        .carta-trasera,
        .carta-delantera {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow:
                5px 5px 0 rgba(0,0,0,0.5),
                inset -3px -3px 0 rgba(0,0,0,0.3),
                inset 3px 3px 0 rgba(255,255,255,0.3);
        }

        .carta-trasera {
            background-color: #4a5fc1;
            background-image:
                repeating-linear-gradient(45deg,
                    #4a5fc1,
                    #4a5fc1 8px,
                    #667eea 8px,
                    #667eea 16px);
            border: 5px solid #ffffff;
        }

        .carta-trasera::after {
            content: "?";
            font-size: clamp(1.5rem, 3vw, 2.5rem);
            font-weight: bold;
            color: #ffcc00;
            text-shadow:
                3px 3px 0 #000,
                -2px -2px 0 #000,
                2px -2px 0 #000,
                -2px 2px 0 #000;
            animation: parpadeo-pixel 1s steps(2) infinite;
        }

        @keyframes parpadeo-pixel {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }

        .carta-delantera {
            background-color: #fff9c4;
            background-image:
                repeating-linear-gradient(90deg,
                    #fff9c4,
                    #fff9c4 8px,
                    #ffeaa7 8px,
                    #ffeaa7 16px);
            border: 5px solid #ffffff;
            transform: rotateY(180deg);
            line-height: 1;
            text-shadow: 2px 2px 0 rgba(0,0,0,0.2);
        }

        .carta.emparejada .carta-delantera {
            background-color: #55efc4;
            background-image:
                repeating-linear-gradient(45deg,
                    #55efc4,
                    #55efc4 8px,
                    #a8e6cf 8px,
                    #a8e6cf 16px);
            border: 5px solid #00b894;
            animation: celebrar-pixel 0.5s steps(5);
            box-shadow:
                0 0 0 3px #00b894,
                0 0 0 6px #55efc4,
                5px 5px 0 rgba(0,0,0,0.5);
        }

        @keyframes celebrar-pixel {
            0% { transform: rotateY(180deg) scale(1); }
            30% { transform: rotateY(180deg) scale(1.15) rotate(-5deg); }
            60% { transform: rotateY(180deg) scale(1.15) rotate(5deg); }
            100% { transform: rotateY(180deg) scale(1); }
        }

        .carta.error .carta-delantera {
            background-color: #ff7675;
            background-image:
                repeating-linear-gradient(-45deg,
                    #ff7675,
                    #ff7675 8px,
                    #fab1a0 8px,
                    #fab1a0 16px);
            border: 5px solid #d63031;
            animation: temblar-pixel 0.4s steps(4);
        }

        @keyframes temblar-pixel {
            0%, 100% { transform: rotateY(180deg) translateX(0); }
            25% { transform: rotateY(180deg) translateX(-6px); }
            75% { transform: rotateY(180deg) translateX(6px); }
        }

        /* ============================================
           MENSAJE DE VICTORIA
           ============================================ */
        .mensaje-victoria {
            position: fixed;
            inset: 0;
            background-color: rgba(0,0,0,0.85);
            background-image:
                repeating-linear-gradient(0deg, transparent, transparent 3px, rgba(255,255,255,0.05) 3px, rgba(255,255,255,0.05) 6px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            animation: aparecer-pixel 0.4s steps(4);
            padding: 20px;
            overflow-y: auto;
        }

        .mensaje-victoria.visible {
            display: flex;
        }

        .contenido-victoria {
            background-color: #fdcb6e;
            background-image:
                repeating-linear-gradient(45deg,
                    #fdcb6e,
                    #fdcb6e 10px,
                    #ffeaa7 10px,
                    #ffeaa7 20px);
            padding: clamp(20px, 4vw, 40px) clamp(25px, 5vw, 50px);
            border: 8px solid #ffffff;
            text-align: center;
            box-shadow:
                12px 12px 0 #000,
                inset -6px -6px 0 rgba(0,0,0,0.2),
                inset 6px 6px 0 rgba(255,255,255,0.4);
            animation: rebotar-pixel 0.5s steps(5);
            max-width: 600px;
            width: 100%;
            margin: auto;
        }

        @keyframes rebotar-pixel {
            0% { transform: scale(0); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        .contenido-victoria h2 {
            font-size: clamp(0.9rem, 2vw, 1.4rem);
            color: #ffffff;
            text-shadow:
                3px 3px 0 #d63031,
                6px 6px 0 #000;
            margin-bottom: 20px;
            line-height: 1.8;
        }

        .contenido-victoria p {
            font-size: clamp(0.6rem, 1.4vw, 0.8rem);
            color: #2d3436;
            margin-bottom: 15px;
            font-weight: bold;
            line-height: 2;
            text-shadow: 1px 1px 0 rgba(255,255,255,0.5);
        }

        .contenido-victoria .estrellas-ganadas {
            font-size: clamp(1.3rem, 3vw, 2rem);
            margin-bottom: 20px;
            animation: brillar-pixel 1s steps(2) infinite;
            filter: drop-shadow(3px 3px 0 #000);
        }

        @keyframes brillar-pixel {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.15); }
        }

        .botones-victoria {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .boton-accion {
            background-color: #00b894;
            background-image:
                repeating-linear-gradient(45deg,
                    #00b894,
                    #00b894 6px,
                    #55efc4 6px,
                    #55efc4 12px);
            border: 4px solid #ffffff;
            padding: 12px 18px;
            font-size: clamp(0.55rem, 1.2vw, 0.7rem);
            font-weight: bold;
            color: #ffffff;
            cursor: pointer;
            box-shadow:
                5px 5px 0 #00895a,
                inset -3px -3px 0 rgba(0,0,0,0.3),
                inset 3px 3px 0 rgba(255,255,255,0.3);
            transition: all 0.1s steps(2);
            font-family: inherit;
            min-height: 48px;
            min-width: 90px;
            text-shadow: 2px 2px 0 #000;
        }

        @media (hover: hover) {
            .boton-accion:hover {
                transform: translate(-2px, -2px);
                box-shadow:
                    7px 7px 0 #00895a,
                    inset -3px -3px 0 rgba(0,0,0,0.3),
                    inset 3px 3px 0 rgba(255,255,255,0.3);
            }
        }

        .boton-accion:active {
            transform: translate(3px, 3px);
            box-shadow:
                2px 2px 0 #00895a,
                inset -3px -3px 0 rgba(0,0,0,0.3),
                inset 3px 3px 0 rgba(255,255,255,0.3);
        }

        .boton-accion.amarillo {
            background-color: #fdcb6e;
            background-image:
                repeating-linear-gradient(-45deg,
                    #fdcb6e,
                    #fdcb6e 6px,
                    #ffeaa7 6px,
                    #ffeaa7 12px);
            color: #d35400;
            box-shadow:
                5px 5px 0 #d4a017,
                inset -3px -3px 0 rgba(0,0,0,0.2),
                inset 3px 3px 0 rgba(255,255,255,0.4);
            text-shadow: 1px 1px 0 #fff;
        }

        @media (hover: hover) {
            .boton-accion.amarillo:hover {
                box-shadow:
                    7px 7px 0 #d4a017,
                    inset -3px -3px 0 rgba(0,0,0,0.2),
                    inset 3px 3px 0 rgba(255,255,255,0.4);
            }
        }

        .boton-accion.amarillo:active {
            box-shadow:
                2px 2px 0 #d4a017,
                inset -3px -3px 0 rgba(0,0,0,0.2),
                inset 3px 3px 0 rgba(255,255,255,0.4);
        }

        /* ============================================
           OPTIMIZACIÓN TABLETS (768px - 1366px)
           ============================================ */
        @media (min-width: 768px) and (max-width: 1366px) {
            body {
                padding: 15px;
                justify-content: flex-start;
                padding-top: 20px;
            }

            #pantalla-niveles { max-width: 1100px; }
            #pantalla-juego { max-width: 1100px; }

            .grid-niveles {
                grid-template-columns: repeat(5, 1fr);
                gap: 14px;
                padding: 25px;
            }

            .boton-nivel {
                min-width: 70px;
                min-height: 70px;
            }

            .tablero {
                max-width: 850px;
                gap: 14px;
                padding: 25px;
            }

            .carta {
                min-width: 70px;
                min-height: 70px;
            }

            .carta-trasera::after {
                font-size: 2.8rem;
            }

            .caja-marcador {
                padding: 12px 22px;
                min-height: 48px;
            }
        }

        @media (min-width: 1024px) and (max-width: 1366px) and (orientation: landscape) {
            body {
                justify-content: center;
                padding-top: 15px;
            }

            #pantalla-niveles,
            #pantalla-juego {
                max-width: 1200px;
            }

            .grid-niveles {
                grid-template-columns: repeat(5, 1fr);
                max-width: 1000px;
                margin: 0 auto;
            }

            .tablero {
                max-width: 900px;
            }

            .barra-superior {
                flex-wrap: nowrap;
                justify-content: space-between;
            }

            .contenido-victoria {
                max-width: 700px;
            }
        }

        @media (min-width: 768px) and (max-width: 900px) and (orientation: portrait) {
            .grid-niveles {
                grid-template-columns: repeat(4, 1fr);
                gap: 12px;
                padding: 20px;
            }

            .tablero {
                max-width: 720px;
                gap: 12px;
            }

            .carta {
                min-width: 65px;
                min-height: 65px;
            }
        }

        /* ============================================
           MÓVILES
           ============================================ */
        @media (max-width: 767px) {
            .titulo-niveles { font-size: 1rem; }
            .subtitulo-niveles { font-size: 0.55rem; padding: 10px 15px; }
            .grid-niveles {
                grid-template-columns: repeat(4, 1fr);
                gap: 10px;
                padding: 15px;
            }
            .boton-nivel .numero-nivel { font-size: 1rem; }
            .boton-nivel .estrellas { font-size: 0.5rem; }
            .titulo-juego { font-size: 0.9rem; }
            .caja-marcador {
                font-size: 0.6rem;
                padding: 8px 12px;
            }
            .caja-marcador span { font-size: 0.75rem; }
            .carta-trasera::after { font-size: 1.8rem; }
            .contenido-victoria {
                padding: 25px 20px;
            }
            .contenido-victoria h2 { font-size: 0.95rem; }
            .contenido-victoria p { font-size: 0.6rem; }
            .contenido-victoria .estrellas-ganadas { font-size: 1.3rem; }
            .boton-volver, .boton-salir, .info-nivel {
                font-size: 0.55rem;
                padding: 10px 12px;
                min-width: 80px;
            }
        }

        @media (max-width: 480px) {
            body { padding: 10px; }
            .grid-niveles {
                grid-template-columns: repeat(3, 1fr);
                gap: 8px;
            }
            .boton-nivel .numero-nivel { font-size: 0.9rem; }
            .titulo-niveles { font-size: 0.85rem; }
            .subtitulo-niveles { font-size: 0.5rem; padding: 8px 12px; }
            .titulo-juego { font-size: 0.75rem; }
            .caja-marcador {
                font-size: 0.55rem;
                padding: 6px 10px;
            }
            .caja-marcador span { font-size: 0.65rem; }
            .tablero { padding: 12px; gap: 8px; }
            .boton-volver, .boton-salir, .info-nivel {
                font-size: 0.5rem;
                padding: 8px 10px;
                min-height: 44px;
                min-width: 70px;
            }
            .boton-accion {
                font-size: 0.55rem;
                padding: 10px 12px;
                min-width: 80px;
            }
        }

        @media (orientation: portrait) and (max-width: 600px) {
            body::before {
                content: "📱 GIRA TU DISPOSITIVO 🔄";
                position: fixed;
                inset: 0;
                background-color: #0f0f23;
                background-image:
                    repeating-linear-gradient(45deg,
                        #16213e,
                        #16213e 15px,
                        #1a1a3e 15px,
                        #1a1a3e 30px);
                color: #ffcc00;
                display: flex;
                justify-content: center;
                align-items: center;
                font-size: 1rem;
                text-align: center;
                padding: 40px;
                z-index: 9999;
                font-weight: bold;
                line-height: 2;
                text-shadow:
                    3px 3px 0 #ff6600,
                    6px 6px 0 #000;
            }
        }
    </style>
</head>
<body>

    <div id="pantalla-niveles">
        <div class="barra-superior-niveles">
            <!-- ✅ Ahora dice "Kinder" y va a Kinder.html -->
            <button class="boton-salir" onclick="salirAlInicio()">🧸 Kinder</button>
        </div>

        <h1 class="titulo-niveles">🎮 ¡ELIGE TU NIVEL! 🎮</h1>
        <p class="subtitulo-niveles">
            🌟 COMPLETA UN NIVEL PARA DESBLOQUEAR EL SIGUIENTE 🌟
        </p>
        <div class="grid-niveles" id="gridNiveles"></div>
    </div>

    <div id="pantalla-juego">
        <div class="barra-superior">
            <button class="boton-volver" onclick="volverANiveles()">⬅️ Niveles</button>
            <div class="info-nivel" id="infoNivel">Nivel 1</div>
            <!-- ✅ Ahora dice "Kinder" y va a Kinder.html -->
            <button class="boton-salir" onclick="salirAlInicio()">🧸 Kinder</button>
        </div>

        <h1 class="titulo-juego">🌟 ENCUENTRA LAS PAREJAS 🌟</h1>

        <div class="marcador">
            <div class="caja-marcador">
                🎯 Intentos: <span id="intentos">0</span>
            </div>
            <div class="caja-marcador">
                ✅ Parejas: <span id="parejas">0</span> / <span id="totalParejas">8</span>
            </div>
        </div>

        <div class="tablero" id="tablero"></div>
    </div>

    <div class="mensaje-victoria" id="mensajeVictoria">
        <div class="contenido-victoria">
            <h2>🎉 ¡NIVEL COMPLETADO! 🎉</h2>
            <div class="estrellas-ganadas" id="estrellasGanadas">⭐⭐⭐</div>
            <p>Lo lograste en <span id="intentosFinales">0</span> intentos</p>
            <p id="mensajeDesbloqueo"></p>
            <div class="botones-victoria">
                <button class="boton-accion amarillo" onclick="reiniciarNivel()">🔄 Repetir</button>
                <button class="boton-accion" id="botonSiguiente" onclick="irSiguienteNivel()">➡️ Siguiente</button>
                <button class="boton-accion" onclick="volverANiveles()">🏠 Niveles</button>
                <!-- ✅ Ahora dice "Kinder" y va a Kinder.html -->
                <button class="boton-accion" onclick="salirAlInicio()">🧸 Kinder</button>
            </div>
        </div>
    </div>

    <script>
        const NIVELES = [
            { parejas: 2, tiempoError: 1500, columnas: 2, emojis: ['🐶', '🐱', '🐭'] },
            { parejas: 3, tiempoError: 1400, columnas: 3, emojis: ['🐶', '🐱', '🐭', '🐹', '🐰'] },
            { parejas: 3, tiempoError: 1300, columnas: 3, emojis: ['🐶', '🐱', '🐭', '🐹', '🐰'] },
            { parejas: 4, tiempoError: 1200, columnas: 4, emojis: ['🐶', '🐱', '🐭', '🐹', '🐰', '🦊', '🐻', '🐼'] },
            { parejas: 4, tiempoError: 1100, columnas: 4, emojis: ['🐶', '🐱', '🐭', '🐹', '🐰', '🦊', '🐻', '🐼'] },
            { parejas: 5, tiempoError: 1000, columnas: 4, emojis: ['🐶', '🐱', '🐭', '🐹', '🐰', '🦊', '🐻', '🐼', '🐨', '🐯'] },
            { parejas: 6, tiempoError: 1000, columnas: 4, emojis: ['🐶', '🐱', '🐭', '🐹', '🐰', '🦊', '🐻', '🐼', '🐨', '🐯', '🦁', '🐮'] },
            { parejas: 6, tiempoError: 900, columnas: 4, emojis: ['🐶', '🐱', '🐭', '🐹', '🐰', '🦊', '🐻', '🐼', '🐨', '🐯', '🦁', '🐮'] },
            { parejas: 6, tiempoError: 900, columnas: 4, emojis: ['🐶', '🐱', '🐭', '🐹', '🐰', '🦊', '🐻', '🐼', '🐨', '🐯', '🦁', '🐮'] },
            { parejas: 7, tiempoError: 800, columnas: 5, emojis: ['🐶', '🐱', '🐭', '🐹', '🐰', '🦊', '🐻', '🐼', '🐨', '🐯', '🦁', '🐮', '🐷', '🐸'] },
            { parejas: 7, tiempoError: 800, columnas: 5, emojis: ['🐶', '🐱', '🐭', '🐹', '🐰', '🦊', '🐻', '🐼', '🐨', '🐯', '🦁', '🐮', '🐷', '🐸'] },
            { parejas: 7, tiempoError: 750, columnas: 5, emojis: ['🐶', '🐱', '🐭', '🐹', '🐰', '🦊', '🐻', '🐼', '🐨', '🐯', '🦁', '🐮', '🐷', '🐸'] },
            { parejas: 8, tiempoError: 700, columnas: 4, emojis: ['🐶', '🐱', '🐭', '🐹', '🐰', '🦊', '🐻', '🐼', '🐨', '🐯', '🦁', '🐮', '🐷', '🐸', '🐵', '🐔'] },
            { parejas: 8, tiempoError: 700, columnas: 4, emojis: ['🐶', '🐱', '🐭', '🐹', '🐰', '🦊', '🐻', '🐼', '🐨', '🐯', '🦁', '🐮', '🐷', '🐸', '🐵', '🐔'] },
            { parejas: 8, tiempoError: 650, columnas: 4, emojis: ['🐶', '🐱', '🐭', '🐹', '🐰', '🦊', '🐻', '🐼', '🐨', '🐯', '🦁', '🐮', '🐷', '🐸', '🐵', '🐔'] },
            { parejas: 9, tiempoError: 600, columnas: 6, emojis: ['🐶', '🐱', '🐭', '🐹', '🐰', '🦊', '🐻', '🐼', '🐨', '🐯', '🦁', '🐮', '🐷', '🐸', '🐵', '🐔', '🐧', '🐦'] },
            { parejas: 9, tiempoError: 600, columnas: 6, emojis: ['🐶', '🐱', '🐭', '🐹', '🐰', '🦊', '🐻', '🐼', '🐨', '🐯', '🦁', '🐮', '🐷', '🐸', '🐵', '🐔', '🐧', '🐦'] },
            { parejas: 9, tiempoError: 550, columnas: 6, emojis: ['🐶', '🐱', '🐭', '🐹', '🐰', '🦊', '🐻', '🐼', '🐨', '🐯', '🦁', '🐮', '🐷', '🐸', '🐵', '🐔', '🐧', '🐦'] },
            { parejas: 10, tiempoError: 500, columnas: 5, emojis: ['🐶', '🐱', '🐭', '🐹', '🐰', '🦊', '🐻', '🐼', '🐨', '🐯', '🦁', '🐮', '🐷', '🐸', '🐵', '🐔', '🐧', '🐦', '🐤', '🦆'] },
            { parejas: 10, tiempoError: 450, columnas: 5, emojis: ['🐶', '🐱', '🐭', '🐹', '🐰', '🦊', '🐻', '🐼', '🐨', '🐯', '🦁', '🐮', '🐷', '🐸', '🐵', '🐔', '🐧', '🐦', '🐤', '🦆'] }
        ];

        let nivelActual = 1;
        let primeraCarta = null;
        let segundaCarta = null;
        let bloqueoTablero = false;
        let intentos = 0;
        let parejasEncontradas = 0;
        let totalParejasNivel = 0;
        let tiempoErrorNivel = 1000;
        let emojisNivel = [];
        let columnasNivel = 4;

        let progreso = { nivelMaximo: 1, nivelesCompletados: [] };

        function cargarProgreso() {
            const guardado = localStorage.getItem('memorama_progreso');
            if (guardado) {
                try { progreso = JSON.parse(guardado); } catch(e) {}
            }
        }

        function guardarProgreso() {
            localStorage.setItem('memorama_progreso', JSON.stringify(progreso));
        }

        const pantallaNiveles = document.getElementById('pantalla-niveles');
        const pantallaJuego = document.getElementById('pantalla-juego');
        const gridNiveles = document.getElementById('gridNiveles');
        const tablero = document.getElementById('tablero');
        const spanIntentos = document.getElementById('intentos');
        const spanParejas = document.getElementById('parejas');
        const spanTotalParejas = document.getElementById('totalParejas');
        const infoNivel = document.getElementById('infoNivel');
        const mensajeVictoria = document.getElementById('mensajeVictoria');
        const intentosFinales = document.getElementById('intentosFinales');
        const estrellasGanadas = document.getElementById('estrellasGanadas');
        const mensajeDesbloqueo = document.getElementById('mensajeDesbloqueo');
        const botonSiguiente = document.getElementById('botonSiguiente');

        function generarPantallaNiveles() {
            gridNiveles.innerHTML = '';
            for (let i = 1; i <= 20; i++) {
                const boton = document.createElement('div');
                boton.classList.add('boton-nivel');

                if (progreso.nivelesCompletados.includes(i)) {
                    boton.classList.add('completado');
                    boton.innerHTML = `<div class="numero-nivel">${i}</div><div class="estrellas">⭐⭐⭐</div>`;
                } else if (i <= progreso.nivelMaximo) {
                    boton.classList.add('desbloqueado');
                    boton.innerHTML = `<div class="numero-nivel">${i}</div><div class="estrellas">▶️</div>`;
                } else {
                    boton.classList.add('bloqueado');
                    boton.innerHTML = `<div class="numero-nivel">${i}</div><div class="estrellas"></div>`;
                }

                if (i <= progreso.nivelMaximo) {
                    boton.addEventListener('click', () => iniciarNivel(i));
                }
                gridNiveles.appendChild(boton);
            }
        }

        function iniciarNivel(numeroNivel) {
            if (numeroNivel > progreso.nivelMaximo) return;
            if (numeroNivel < 1 || numeroNivel > 20) return;

            nivelActual = numeroNivel;
            const config = NIVELES[nivelActual - 1];
            totalParejasNivel = config.parejas;
            tiempoErrorNivel = config.tiempoError;
            emojisNivel = config.emojis;
            columnasNivel = config.columnas;

            pantallaNiveles.style.display = 'none';
            pantallaJuego.classList.add('visible');

            infoNivel.textContent = `Nivel ${nivelActual} de 20`;
            spanTotalParejas.textContent = totalParejasNivel;

            iniciarTablero();
        }

        function iniciarTablero() {
            primeraCarta = null;
            segundaCarta = null;
            bloqueoTablero = false;
            intentos = 0;
            parejasEncontradas = 0;
            spanIntentos.textContent = '0';
            spanParejas.textContent = '0';
            mensajeVictoria.classList.remove('visible');
            tablero.innerHTML = '';

            tablero.style.gridTemplateColumns = `repeat(${columnasNivel}, 1fr)`;

            let tamañoEmoji = 'clamp(2rem, 4vw, 3.5rem)';
            if (totalParejasNivel <= 3) tamañoEmoji = 'clamp(2.5rem, 5vw, 4rem)';
            else if (totalParejasNivel <= 5) tamañoEmoji = 'clamp(2rem, 4vw, 3.2rem)';
            else if (totalParejasNivel <= 7) tamañoEmoji = 'clamp(1.8rem, 3.5vw, 2.6rem)';
            else if (totalParejasNivel <= 8) tamañoEmoji = 'clamp(1.6rem, 3vw, 2.2rem)';
            else tamañoEmoji = 'clamp(1.5rem, 2.8vw, 2rem)';

            const emojisSeleccionados = emojisNivel.slice(0, totalParejasNivel);
            const cartasMezcladas = [...emojisSeleccionados, ...emojisSeleccionados]
                .sort(() => Math.random() - 0.5);

            cartasMezcladas.forEach((emoji) => {
                const carta = document.createElement('div');
                carta.classList.add('carta');
                carta.dataset.emoji = emoji;
                carta.innerHTML = `
                    <div class="carta-interna">
                        <div class="carta-trasera"></div>
                        <div class="carta-delantera" style="font-size: ${tamañoEmoji};">${emoji}</div>
                    </div>
                `;
                carta.addEventListener('click', () => voltearCarta(carta));
                tablero.appendChild(carta);
            });
        }

        function voltearCarta(carta) {
            if (bloqueoTablero) return;
            if (carta.classList.contains('volteada')) return;
            if (carta.classList.contains('emparejada')) return;

            carta.classList.add('volteada');

            if (!primeraCarta) {
                primeraCarta = carta;
                return;
            }

            segundaCarta = carta;
            bloqueoTablero = true;
            intentos++;
            spanIntentos.textContent = intentos;
            compararCartas();
        }

        function compararCartas() {
            const sonPareja = primeraCarta.dataset.emoji === segundaCarta.dataset.emoji;

            if (sonPareja) {
                primeraCarta.classList.add('emparejada');
                segundaCarta.classList.add('emparejada');
                parejasEncontradas++;
                spanParejas.textContent = parejasEncontradas;
                reiniciarComparacion();

                if (parejasEncontradas === totalParejasNivel) {
                    setTimeout(mostrarVictoria, 700);
                }
            } else {
                primeraCarta.classList.add('error');
                segundaCarta.classList.add('error');
                setTimeout(() => {
                    primeraCarta.classList.remove('volteada', 'error');
                    segundaCarta.classList.remove('volteada', 'error');
                    reiniciarComparacion();
                }, tiempoErrorNivel);
            }
        }

        function reiniciarComparacion() {
            primeraCarta = null;
            segundaCarta = null;
            bloqueoTablero = false;
        }

        function mostrarVictoria() {
            intentosFinales.textContent = intentos;
            const intentosPerfectos = totalParejasNivel + 2;
            const intentosBuenos = totalParejasNivel * 2;

            let estrellas = '⭐';
            if (intentos <= intentosPerfectos) estrellas = '⭐⭐⭐';
            else if (intentos <= intentosBuenos) estrellas = '⭐⭐';
            estrellasGanadas.textContent = estrellas;

            if (!progreso.nivelesCompletados.includes(nivelActual)) {
                progreso.nivelesCompletados.push(nivelActual);
            }

            if (nivelActual === progreso.nivelMaximo && progreso.nivelMaximo < 20) {
                progreso.nivelMaximo = nivelActual + 1;
                mensajeDesbloqueo.textContent = `🔓 ¡Nivel ${progreso.nivelMaximo} desbloqueado!`;
                mensajeDesbloqueo.style.color = '#00b894';
            } else if (nivelActual === 20) {
                mensajeDesbloqueo.textContent = '🏆 ¡FELICIDADES! ¡Completaste los 20 niveles!';
                mensajeDesbloqueo.style.color = '#e17055';
            } else {
                mensajeDesbloqueo.textContent = '';
            }

            guardarProgreso();

            if (nivelActual >= 20) botonSiguiente.style.display = 'none';
            else botonSiguiente.style.display = 'inline-block';

            mensajeVictoria.classList.add('visible');
        }

        function reiniciarNivel() { iniciarNivel(nivelActual); }
        function irSiguienteNivel() { if (nivelActual < 20) iniciarNivel(nivelActual + 1); }

        function volverANiveles() {
            mensajeVictoria.classList.remove('visible');
            pantallaJuego.classList.remove('visible');
            pantallaJuego.style.display = 'none';
            pantallaNiveles.style.display = 'flex';
            generarPantallaNiveles();
        }

        // ✅ AHORA VA A Kinder.html
        function salirAlInicio() {
            window.location.href = 'Kinder.html';
        }

        let ultimoToque = 0;
        document.addEventListener('touchend', function(event) {
            const ahora = new Date().getTime();
            if (ahora - ultimoToque <= 300) event.preventDefault();
            ultimoToque = ahora;
        }, { passive: false });

        document.addEventListener('gesturestart', function(e) { e.preventDefault(); });

        cargarProgreso();
        generarPantallaNiveles();
    </script>

</body>
</html>
